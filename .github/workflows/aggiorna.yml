name: Aggiorna calendario Mastercom
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright cryptography && playwright install --with-deps chromium
      - run: python mastercom_calendario.py
        env:
          MC_USER: ${{ secrets.MC_USER }}
          MC_PASS: ${{ secrets.MC_PASS }}
          VOTI_PASS: ${{ secrets.VOTI_PASS }}
      - name: Salva i file
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/dati.json docs/compiti.ics docs/voti.enc || true
          git diff --cached --quiet || (git commit -m "aggiornamento" && git push)
